name: CI

on:
    pull_request:
        branches: [develop, main]
    push:
        branches: [develop, main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # The machine half of the definition of done. Gates run fast-to-slow so the
    # cheapest signal arrives first; see §4.1 of the roadmap design.
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  # gitleaks scans history, which a shallow clone does not have.
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: npm

            - name: Install
              run: npm ci

            - name: Build shared
              run: npm run build:shared

            - name: Type check
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Format
              run: npm run format:check

            - name: Unit + integration tests
              run: npx vitest run --passWithNoTests

            - name: Production build
              run: npm run build

            - name: Secret scan
              run: |
                  curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
                    | tar -xz -C /tmp gitleaks
                  /tmp/gitleaks git --redact --verbose .
              env:
                  GITLEAKS_VERSION: 8.30.1

            - name: Pending tests
              # A milestone may not merge with its own test list unfinished. Vitest
              # marks a pending test with .todo, Playwright with .fixme; .only focuses
              # a run and silently skips the rest. Scoped to source and test folders
              # so this workflow file cannot match itself.
              run: |
                  if grep -rnE '\b(it|test|describe)\.(todo|fixme)\b|\b(it|test|describe)\.only\(' \
                       --include='*.ts' --include='*.tsx' shared/src server/src server/test client/src e2e; then
                    echo "::error::Pending or focused tests found. Promote or remove them before merging."
                    exit 1
                  fi
                  echo "No pending or focused tests."

    # Whole-stack journeys in a real browser against this pull request's own
    # production build. Not the deployed site: that serves code merged earlier,
    # and from M1 the journeys write data. See the gate table in WORKFLOW.md.
    e2e:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: npm

            - name: Install
              run: npm ci

            - name: Start MongoDB
              # A single-node replica set, not a standalone mongod: review writes run
              # in transactions (ADR-009), which a standalone rejects. A service
              # container cannot take --replSet, hence docker run. Pinned to 7: mongo:8
              # refuses to start on Linux kernel 6.19+ (SERVER-121912), which Docker
              # Desktop and newer runner images can ship.
              run: |
                  docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
                  for attempt in $(seq 1 30); do
                    docker exec mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' && break
                    sleep 1
                  done
                  docker exec mongo mongosh --quiet --eval \
                    "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"
                  for attempt in $(seq 1 30); do
                    docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && exit 0
                    sleep 1
                  done
                  echo "::error::MongoDB did not become primary." && exit 1

            - name: Production build
              run: npm run build

            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            - name: End-to-end tests
              # No E2E_BASE_URL, so playwright.config.ts starts the built API and
              # vite preview on this runner. The env is scoped to this step, not the
              # job: a NODE_ENV other than production during the build makes Vite
              # bundle React in development mode, whose StrictMode double-fires effects.
              run: npx playwright test
              env:
                  NODE_ENV: test
                  PORT: '3000'
                  MONGODB_URI: mongodb://localhost:27017/yelpcamp?replicaSet=rs0

            - name: Keep traces and screenshots
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 14
